[package]
name = "nandoize"
version = "0.1.0"
edition = "2021"
description = "Procedural macro used to register nanotransactions."

[lib]
proc-macro = true

[dependencies]
file-lock = "2.1.9"
once_cell = "1.16.0"
proc-macro2 = "1.0.47"
quote = "1.0.21"
syn = { version = "2.0.17", features = ["extra-traits", "printing", "full"] }

nando-support = { path = "../../nando-support" }

[features]

epic_opts = []
