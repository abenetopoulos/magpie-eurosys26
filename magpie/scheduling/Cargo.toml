[package]
name = "scheduling"
version = "0.1.0"
edition = "2021"

[dependencies]

async-lib = { path = "../async-lib" }
execution-definitions = { path = "../execution-definitions" }
location-manager = { path = "../location-manager" }
nando-lib = { path = "../nando-lib" }
nando-support = { path = "../../nando-support" }
object-lib = { path = "../../object-lib" }
object-tracker = { path = "../object-tracker" }
ownership-tracker = { path = "../ownership-tracker" }
ownership-support = { path = "../../ownership-support" }
telemetry = { path = "../../telemetry" }

async-std = { version = "1.12.0", features = ["unstable"] }
axum = { version = "=0.7.4", features = ["json"] }
axum-macros = "0.3.8"
serde = {version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
tokio = {version = "1.36.0", features = ["full"] }
reqwest = { version = "0.12.4", default-features = false, features = ["json"] }
parking_lot = "0.12.1"
lazy_static = "1.4.0"
prometheus = "0.13.3"
tonic = "0.12.1"
prost = "0.13.1"
# dashmap = "6.0.1"
dashmap = { version = "5.5.3", features = ["inline"] }
futures = "0.3.31"
# NOTE to match tonic's version
# hyper = "1..26"
# tower = "0.4.13"

[build-dependencies]
tonic-build = "0.12.1"

[features]

offline = []
object-caching = []

observability = []
timing-svc-latency = []

timing-ownership-transfer = []

telemetry = []
