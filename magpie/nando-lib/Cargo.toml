[package]
name = "nando-lib"
version = "0.1.0"
edition = "2021"
description = "Exposes nando-related definitions and an interface with the underlying execution engine"

[dependencies]

async-lib = { path = "../async-lib" }
execution-definitions = { path = "../execution-definitions" }
location-manager = { path = "../location-manager" }
logging = { path = "../logging" }
nando-support = { path = "../../nando-support" }
nandoize = { path = "../nandoize" }
object-lib = { path = "../../object-lib" }
object-tracker = { path = "../object-tracker" }
ownership-tracker = { path = "../ownership-tracker" }
telemetry = { path = "../../telemetry" }

async-std = { version = "1.12.0", features = ["unstable"] }
crossbeam-channel = "0.5.8"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
rtrb = "0.3.1"
rand = "0.8.5"
parking_lot = "0.12.1"
libloading = "0.8.1"
core_affinity = "0.8.1"
# dashmap = "6.0.1"
dashmap = { version = "5.5.3", features = ["inline"] }
tokio = "1.37.0"
prometheus = "0.13.4"
lazy_static = "1.4.0"
atomic_refcell = "0.1.13"


[features]

always-flush-total = []
always-flush-range = []

timing-core-sched = ["nando-support/timing"]
timing = ["timing-core-sched"]

timing-exec = []
timing-tm = []
timing-tm-wait = []
timing-sched-submission = []
timing-sched-completion = []

object-caching = ["object-lib/object-caching", "object-tracker/object-caching"]

offline = ["ownership-tracker/offline"]

observability = []

no-persist = ["object-lib/no-persist", "logging/no-persist"]
telemetry = []

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }
