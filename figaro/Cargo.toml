[package]
name = "figaro"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4.0"
async-std = "1.12.0"
clap = { version = "4.4.10", features = ["derive"] }
parking_lot = "0.12.1"
rand = { version = "0.8.5", features = ["small_rng"] }
reqwest = { version = "0.11.22", features = ["json"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.108"
tokio = "1.34.0"
toml = "0.8.8"

nando-support = { path = "../nando-support" }
ownership-support = { path = "../ownership-support" }

[features]

always_move = []
